
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONNECT ME</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f0f2f5}
header{background:#0866ff;color:white;padding:18px;font-size:25px;font-weight:bold}
main{max-width:650px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:15px}
input,button{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
button{background:#0866ff;color:white;border:0;font-weight:bold}
.post{padding:15px;background:#fff;border-radius:10px;margin-top:12px}
</style>
</head>
<body>
<header>CONNECT ME</header>
<main>
<div class="card">
<h2>Welcome to CONNECT ME</h2>
<p>Connect. Discover. Share.</p>
<input id="postInput" placeholder="What's on your mind?">
<button onclick="addPost()">Publish Post</button>
</div>
<h3>Discover Posts</h3>
<div id="posts"></div>
</main>
<script>
function addPost(){
const input=document.getElementById("postInput");
const value=input.value.trim();
if(!value){alert("Write something first!");return;}
const post=document.createElement("div");
post.className="post";
post.textContent=value;
document.getElementById("posts").prepend(post);
input.value="";
}
</script>
</body>
</html>
